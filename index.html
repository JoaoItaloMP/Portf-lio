<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Italo DEV | Full Stack Developer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="htpps://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="#" class="logo">Testes <span>.dev</span></a>

                <!-- Desktop Navigation -->
                <div class="nav-links">
                    <button onclick="scrollToSection('home')" class="nav-link">Home</button>
                    <button onclick="scrollToSection('about')" class="nav-link">Sobre</button>
                    <button onclick="scrollToSection('skills')" class="nav-link">Habilidades</button>
                    <button onclick="scrollToSection('projects')" class="nav-link">Projetos</button>
                    <button onclick="scrollToSection('contact')" class="nav-link">Contatos</button>
                </div>

                <!-- Mobile Menu Button -->
                 <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                 </button>

                 <div class="mobile-menu" id="mobileMenu">
                    <button onclick="scrollToSection('home')" class="mobile-nav-link">Home</button>
                    <button onclick="scrollToSection('about')" class="mobile-nav-link">Sobre</button>
                    <button onclick="scrollToSection('skills')" class="mobile-nav-link">Habilidades</button>
                    <button onclick="scrollToSection('projects')" class="mobile-nav-link">Projetos</button>
                    <button onclick="scrollToSection('contact')" class="mobile-nav-link">Contatos</button>
                 </div>
            </nav>
        </div>
    </header>

    <main>

        <section id="home" class="hero-section">
            <div class="container">
                <div class="hero-content">
                    <div class="hero-text animate-left">
                        <h1>Olá, eu sou <spam class="text-primary">Test Dev</spam></h1>
                        <h2>Full Stack Developer</h2>
                        <p>
                            Eu crio experiências digitais...(Seu comentario)
                        </p>
                        <div class="hero-buttons">
                            <button class="primary-btn" onclick="scrollToSection('projects')">
                                Veja meu trabalho
                            </button>
                            <button class="outline-btn" onclick="scrollToSection('contact')">
                                Entre em contato comigo
                            </button>
                        </div>

                        <!-- Midias -->
                        <div class="social-links">
                            <a href="https://github.com/JoaoItaloMP" target="_blank" rel="noopener noreferrer">
                                <i class="fab fa-github"></i>
                            </a>
                            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                                <i class="fab fa-linkedin-in"></i>
                            </a>
                            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                                <i class="fab fa-twitter"></i>
                            </a>
                            <a href="mailto:mastedhd@gmail.com">
                                <i class="fab fa-envelope"></i>
                            </a>
                        </div>
                    </div>
                    <div class="hero-image animate-right">
                        <div class="image-container">
                            <img src="https://img.freepik.com/vetores-gratis/laptop-com-icone-de-codigo-isometrico-de-programa-desenvolvimento-de-software-e-aplicacoes-de-programacao-neon-escuro_39422-971.jpg"
                            alt="Teste Dev - Full Stack Developer"/>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- About Section -->
        <section id="about" class="about-section">

        </section>
        <!-- Skills Section -->
        <section id="skills" class="skills-section">

        </section>
        <!-- Projects Section-->
        <section id="projects" class="projects-section">

        </section>
        <!-- Contact Section -->
        <section id="contact" class="contact-section">

        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">

    </footer>

    <!-- Scrool to Top Button -->
    <button class="scroll-top-btn" id="scrollToTopBtn">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <div class="toast-icon sucess">
                <i class="fas fa-check"></i>
            </div>

            <div class="toast-message-container">
                <div class="toast-title">Sucesso</div>
                <div class="toast-message">Sua mensagem foi enviada com sucesso!</div>
            </div>

            <button class="toast-close" onclick="closeToast()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
</body>
</html>
